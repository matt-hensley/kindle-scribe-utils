[tools]
# `just` drives the tasks. `shellcheck` lints the shell scripts.
just = "1.58.0"
shellcheck = "0.11.0"

[settings]
experimental = true

[tasks.setup]
description = "Full one-shot SSH setup (idempotent; needs one tap on the device)"
run = ["just setup"]

[tasks."setup:reboot-test"]
description = "Setup, then reboot the device to prove the boot job works"
run = ["just setup-reboot-test"]

[tasks.push]
description = "Push the Start SSH scriptlet over MTP (then tap it on the Kindle)"
run = ["just push"]

[tasks.find]
description = "Locate the Kindle on the LAN by MAC"
run = ["just find-kindle"]

[tasks.autostart]
description = "Install or reinstall the upstart boot jobs"
run = ["just autostart"]

[tasks.status]
description = "Boot job state, dropbear pid, listeners on 22"
run = ["just status"]

[tasks.health]
description = "Wifi, power and port state — why a device may be unreachable"
run = ["just health"]

[tasks."watchdog:log"]
description = "Show the dropbear watchdog log"
run = ["just watchdog-log"]

[tasks.lint]
description = "shellcheck the scripts"
run = ["shellcheck -S warning scripts/*.sh"]
